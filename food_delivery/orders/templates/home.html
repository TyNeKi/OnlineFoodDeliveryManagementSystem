<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body>
    <div class="navbar">
        <h1>HOME</h1>

        <div class="nav-center">
            <a href="{% url 'add_new_order' %}">Add New Order</a>
            <a href="{% url 'edit_profile' %}">Edit Profile</a>
        </div>

        <div class="nav-right">
            <a href="{% url 'logoff' %}">LOGOUT</a>
        </div>
    </div>

    <div class="content">
        <h2>Welcome!</h2>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="toast">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

</body>
</html>
